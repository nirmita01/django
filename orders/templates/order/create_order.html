{% extends "home/base.html" %}

{% block content %}

<style>
    .order-form-page {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: #f4f7fc;
    }

    .order-form-card {
        width: 100%;
        max-width: 650px;
        background: #ffffff;
        padding: 35px;
        border-radius: 14px;
        border-top: 5px solid #007bff;
        box-shadow: 0 8px 25px rgba(0, 123, 255, 0.12);
    }

    .order-form-card h2 {
        margin: 0 0 8px;
        text-align: center;
        color: #007bff;
        font-size: 26px;
        font-weight: 600;
    }

    .order-form-subtitle {
        text-align: center;
        color: #6c757d;
        margin-bottom: 28px;
        font-size: 14px;
    }

    .order-form-card form p {
        margin-bottom: 18px;
    }

    .order-form-card label {
        display: block;
        margin-bottom: 7px;
        color: #343a40;
        font-size: 14px;
        font-weight: 600;
    }

    .order-form-card input,
    .order-form-card select,
    .order-form-card textarea {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid #ced4da;
        border-radius: 7px;
        background: #f8fbff;
        color: #333;
        font-size: 14px;
        box-sizing: border-box;
        transition: 0.25s ease;
    }

    .order-form-card input:hover,
    .order-form-card select:hover,
    .order-form-card textarea:hover {
        border-color: #80bdff;
        background: #ffffff;
    }

    .order-form-card input:focus,
    .order-form-card select:focus,
    .order-form-card textarea:focus {
        outline: none;
        border-color: #007bff;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.12);
    }

    .order-form-card select {
        cursor: pointer;
    }

    .order-form-card ul {
        padding-left: 20px;
        margin-top: 8px;
    }

    .order-form-card .errorlist {
        color: #dc3545;
        font-size: 13px;
        margin: 5px 0;
        padding-left: 18px;
    }

    .order-form-actions {
        display: flex;
        gap: 12px;
        margin-top: 28px;
    }

    .save-btn,
    .cancel-btn {
        flex: 1;
        padding: 12px 18px;
        border-radius: 7px;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        transition: 0.25s ease;
    }

    .save-btn {
        border: none;
        background: #007bff;
        color: white;
        box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
    }

    .save-btn:hover {
        background: #0056b3;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(0, 123, 255, 0.3);
    }

    .cancel-btn {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffe69c;
    }

    .cancel-btn:hover {
        background: #ffc107;
        color: #212529;
        transform: translateY(-2px);
    }

    @media (max-width: 600px) {
        .order-form-page {
            padding: 25px 15px;
        }

        .order-form-card {
            padding: 25px 20px;
        }

        .order-form-card h2 {
            font-size: 23px;
        }

        .order-form-actions {
            flex-direction: column;
        }
    }
</style>

<div class="order-form-page">

    <div class="order-form-card">

        <h2>➕ Add Order</h2>

        <p class="order-form-subtitle">
            Enter the order details below
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="order-form-actions">

                <button type="submit" class="save-btn">
                    💾 Save Order
                </button>

                <a href="{% url 'order_list' %}" class="cancel-btn">
                    ↩️ Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
