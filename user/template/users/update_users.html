{% extends "home/base.html" %}

{% block content %}

<div class="form-container">

    <h2>Update User</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="update-btn">
            Update User
        </button>

    </form>

</div>

<style>

.form-container{
    width:500px;
    margin:40px auto;
    padding:30px;
    background:#fff;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.form-container h2{
    text-align:center;
    margin-bottom:20px;
    color:#343a40;
}

.form-container p{
    margin-bottom:15px;
}

.form-container label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

.form-container input,
.form-container select,
.form-container textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    box-sizing:border-box;
}

.update-btn{
    background:#0d6efd;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.update-btn:hover{
    background:#0b5ed7;
}

.cancel-btn{
    background:#6c757d;
    color:white;
    text-decoration:none;
    padding:10px 20px;
    border-radius:5px;
    margin-left:10px;
}

.cancel-btn:hover{
    background:#5c636a;
}

</style>

{% endblock %}
