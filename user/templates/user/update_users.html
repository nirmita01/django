{% extends "home/base.html" %}

{% block content %}

<style>
    .user-form-page {
        min-height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #fff8ec, #f8fbff);
    }

    .user-form-card {
        width: 100%;
        max-width: 650px;
        background: #fff;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        border-top: 6px solid #fd7e14;
    }

    .user-form-card h2 {
        text-align: center;
        color: #fd7e14;
        font-size: 30px;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    .user-form-card form p {
        margin-bottom: 18px;
    }

    .user-form-card label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #333;
    }

    .user-form-card input,
    .user-form-card select,
    .user-form-card textarea {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #d6dce5;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
        box-sizing: border-box;
    }

    .user-form-card input:focus,
    .user-form-card select:focus,
    .user-form-card textarea:focus {
        outline: none;
        border-color: #fd7e14;
        box-shadow: 0 0 0 4px rgba(253, 126, 20, 0.15);
    }

    .form-buttons {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    .update-btn,
    .cancel-btn {
        flex: 1;
        padding: 13px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        text-align: center;
        text-decoration: none;
        transition: 0.3s;
        cursor: pointer;
    }

    .update-btn {
        background: linear-gradient(135deg, #fd7e14, #ffb347);
        color: white;
        border: none;
    }

    .update-btn:hover {
        background: linear-gradient(135deg, #e66a00, #ff9800);
        transform: translateY(-2px);
    }

    .cancel-btn {
        background: #f1f3f5;
        color: #555;
        border: 1px solid #ced4da;
    }

    .cancel-btn:hover {
        background: #dee2e6;
        color: #222;
    }

    .errorlist {
        color: #dc3545;
        font-size: 13px;
        margin: 5px 0;
    }

    @media (max-width: 600px) {
        .user-form-card {
            padding: 25px;
        }

        .form-buttons {
            flex-direction: column;
        }
    }
</style>

<div class="user-form-page">

    <div class="user-form-card">

        <h2>✏️ Update User</h2>
        <p class="subtitle">Modify the user information below.</p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-buttons">

                <button type="submit" class="update-btn">
                    💾 Update User
                </button>

                <a href="{% url 'user_list' %}" class="cancel-btn">
                    ✖ Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
