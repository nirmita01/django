{% extends "home/base.html" %}

{% block content %}

<div class="category-container">

    <div class="header">
        <h2>Category List</h2>

        <a href="{% url 'category_create' %}" class="add-btn">
            Add Category
        </a>
    </div>

    <table class="category-table">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

        {% for category in categories %}

            <tr>
                <td>{{ category.id }}</td>
                <td>{{ category.name }}</td>
                <td>{{ category.description }}</td>

                <td>
                    <a href="{% url 'category_update' category.id %}" class="edit-btn">
                        Edit
                    </a>

                    <a href="{% url 'category_delete' category.id %}" class="delete-btn">
                        Delete
                    </a>
                </td>
            </tr>

        {% empty %}

            <tr>
                <td colspan="4" class="no-data">
                    No categories found.
                </td>
            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

<style>

.category-container{
    width:95%;
    margin:30px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.add-btn{
    background:#0d6efd;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:5px;
}

.category-table{
    width:100%;
    border-collapse:collapse;
}

.category-table th{
    background:#343a40;
    color:white;
    padding:12px;
}

.category-table td{
    border:1px solid #ddd;
    padding:10px;
}

.category-table tr:nth-child(even){
    background:#f8f9fa;
}

.edit-btn{
    background:#ffc107;
    color:black;
    text-decoration:none;
    padding:6px 12px;
    border-radius:4px;
    margin-right:5px;
}

.delete-btn{
    background:#dc3545;
    color:white;
    text-decoration:none;
    padding:6px 12px;
    border-radius:4px;
}

.no-data{
    text-align:center;
}

</style>

{% endblock %}
