```html id="qk9mvt"
{% extends "home/base.html" %}

{% block content %}

<style>
    .product-form-page {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: #f4f7fc;
    }

    .product-form-card {
        width: 100%;
        max-width: 650px;
        background: #ffffff;
        padding: 35px;
        border-radius: 14px;
        border-top: 5px solid #007bff;
        box-shadow: 0 8px 25px rgba(0, 123, 255, 0.12);
    }

    .product-form-card h2 {
        text-align: center;
        color: #007bff;
        margin-bottom: 8px;
        font-size: 28px;
        font-weight: 600;
    }

    .product-form-subtitle {
        text-align: center;
        color: #6c757d;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .product-form-card form p {
        margin-bottom: 18px;
    }

    .product-form-card label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        color: #444;
    }

    .product-form-card input,
    .product-form-card select,
    .product-form-card textarea {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid #ced4da;
        border-radius: 7px;
        background: #f8fbff;
        font-size: 14px;
        transition: .25s;
        box-sizing: border-box;
    }

    .product-form-card input:focus,
    .product-form-card select:focus,
    .product-form-card textarea:focus {
        outline: none;
        border-color: #007bff;
        background: white;
        box-shadow: 0 0 0 3px rgba(0,123,255,.12);
    }

    .product-form-card .errorlist {
        color: #dc3545;
        font-size: 13px;
        padding-left: 18px;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    .save-btn,
    .cancel-btn {
        flex: 1;
        padding: 12px;
        border-radius: 7px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        text-align: center;
        transition: .3s;
        cursor: pointer;
    }

    .save-btn {
        border: none;
        background: #007bff;
        color: white;
    }

    .save-btn:hover {
        background: #0056b3;
        color: white;
        transform: translateY(-2px);
    }

    .cancel-btn {
        background: #f95151;
        color: #212529;
        border: 1px solid #871f1f;
    }

    .cancel-btn:hover {
        background: #771c1c;
        color: white;
        transform: translateY(-2px);
    }

    @media(max-width:600px){

        .product-form-card{
            padding:25px 20px;
        }

        .form-actions{
            flex-direction:column;
        }

    }
</style>

<div class="product-form-page">

    <div class="product-form-card">

        <h2>📦 Add Product</h2>

        <p class="product-form-subtitle">
            Enter the product details below
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">

                <button type="submit" class="save-btn">
                    💾 Save Product
                </button>

                <a href="{% url 'products_list' %}" class="cancel-btn">
                    ↩️ Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
```
