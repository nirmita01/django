{% extends "home/base.html" %}

{% block content %}

<div class="form-container">

<h2>Update Product</h2>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button type="submit" class="update-btn">Update</button>

<a href="{% url 'product_list' %}" class="cancel-btn">Cancel</a>

</form>

</div>

<style>

.form-container{
    width:500px;
    margin:40px auto;
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
}

.update-btn{
    background:#0d6efd;
    color:white;
    padding:10px 20px;
    border:none;
}

.cancel-btn{
    background:gray;
    color:white;
    padding:10px 20px;
    text-decoration:none;
}

</style>

{% endblock %}
