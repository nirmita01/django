{% extends "home/base.html" %}

{% block content %}

<style>
    .supplier-form-page {
        min-height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #eef7ff, #f8fbff);
        padding: 40px 20px;
    }

    .supplier-form-card {
        width: 100%;
        max-width: 650px;
        background: #ffffff;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        border-top: 6px solid #198754;
    }

    .supplier-form-card h2 {
        text-align: center;
        color: #198754;
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .supplier-form-card p.subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 28px;
    }

    .supplier-form-card form p {
        margin-bottom: 18px;
    }

    .supplier-form-card label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #444;
    }

    .supplier-form-card input,
    .supplier-form-card textarea,
    .supplier-form-card select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ced4da;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
        box-sizing: border-box;
    }

    .supplier-form-card textarea {
        resize: vertical;
        min-height: 90px;
    }

    .supplier-form-card input:focus,
    .supplier-form-card textarea:focus,
    .supplier-form-card select:focus {
        outline: none;
        border-color: #198754;
        box-shadow: 0 0 8px rgba(25, 135, 84, 0.25);
    }

    .button-group {
        display: flex;
        gap: 15px;
        margin-top: 25px;
    }

    .save-btn,
    .cancel-btn {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    .save-btn {
        background: linear-gradient(135deg, #198754, #20c997);
        color: white;
        border: none;
        cursor: pointer;
    }

    .save-btn:hover {
        background: linear-gradient(135deg, #157347, #198754);
        transform: translateY(-2px);
    }

    .cancel-btn {
        background: #6c757d;
        color: white;
    }

    .cancel-btn:hover {
        background: #5a6268;
        color: white;
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {
        .button-group {
            flex-direction: column;
        }

        .supplier-form-card {
            padding: 25px;
        }
    }
</style>

<div class="supplier-form-page">

    <div class="supplier-form-card">

        <h2>➕ Add Supplier</h2>
        <p class="subtitle">Fill in the supplier details below.</p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="button-group">

                <button type="submit" class="save-btn">
                    💾 Create Supplier
                </button>

                <a href="{% url 'supplier_list' %}" class="cancel-btn">
                    ❌ Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
