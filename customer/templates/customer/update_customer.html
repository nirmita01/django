{% extends "home/base.html" %}

{% block content %}

<div class="form-container">

    <h2>Update Customer</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="update-btn">
            Update
        </button>

        <a href="{% url 'customer_list' %}" class="cancel-btn">
            Cancel
        </a>

    </form>

</div>

<style>

.form-container{
    width:500px;
    margin:40px auto;
}

input,textarea{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

.update-btn{
    background:#0d6efd;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:5px;
}

.cancel-btn{
    background:gray;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:5px;
    margin-left:10px;
}

</style>

{% endblock %}
